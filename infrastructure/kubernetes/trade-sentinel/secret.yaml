apiVersion: v1
kind: Secret
metadata:
  name: trade-sentinel-secret
  namespace: trade-sentinel
type: Opaque
stringData:
  DATABASE_PASSWORD: "secretpassword"
  # In a real environment, the DATABASE_URL would be constructed dynamically, 
  # or passed as a single string. Here we pass the full URL for SQLAlchemy.
  DATABASE_URL: "postgresql://postgres:secretpassword@postgres:5432/tradedb"
